name: Server

# 两套产物：
#   1. 二进制版（job: binary）→ lfdd-server-bin → lfdd-server-linux-amd64.tar.gz
#      解压后直接运行 ./lfdd，配置/数据库自动生成在运行目录的 data/ 下
#   2. 镜像版（job: image）→ 推送到 GHCR，同时导出 lfdd-server.tar
#      ghcr.io/<owner>/lfdd-server:latest / :main / :vX.Y.Z / :sha-xxxx
#      docker load -i lfdd-server.tar && docker run -d -p 9081:9081 -v lfdd-data:/app/data lfdd-server:latest
# 触发：手动运行、推送 v* 标签、main 分支上 server 目录变更。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/server.yml"

jobs:
  # 非镜像版本：纯 Go 二进制（CGO 编译，依赖系统 glibc，Alpine 需用镜像版）
  binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: 编译二进制
        working-directory: server
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/lfdd" .

      - name: 打包
        run: |
          chmod +x "$RUNNER_TEMP/lfdd"
          tar -czf "$RUNNER_TEMP/lfdd-server-linux-amd64.tar.gz" -C "$RUNNER_TEMP" lfdd

      - uses: actions/upload-artifact@v4
        with:
          name: lfdd-server-bin
          path: ${{ runner.temp }}/lfdd-server-linux-amd64.tar.gz
          if-no-files-found: error

  # 镜像版本：推送到 GHCR，同时导出 tar 供离线部署
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ${{ github.repository }}-server
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          # type=registry 推送只需单平台；需要 arm64 时改 platforms 并分别导出
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 导出离线 tar
        env:
          TAG: ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
        run: |
          docker pull "$TAG"
          docker tag "$TAG" lfdd-server:latest
          docker save lfdd-server:latest -o "$RUNNER_TEMP/lfdd-server.tar"

      - uses: actions/upload-artifact@v4
        with:
          name: lfdd-server-image
          path: ${{ runner.temp }}/lfdd-server.tar
          if-no-files-found: error

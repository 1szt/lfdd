name: Server Image

# 构建后端（Go）Docker 镜像并推送到 GitHub 容器仓库 GHCR：
#   ghcr.io/<owner>/<repo>-server:latest / :main / :vX.Y.Z / :sha-xxxx
# 触发：手动运行、推送 v* 标签、main 分支上 server 目录变更。
# 首次推送后到仓库 Packages 页面把镜像可见性改为 Public（默认 Private，需登录才能拉取）。
#
# 运行示例：
#   docker run -d --name lfdd-server -p 9081:9081 \
#     -v lfdd-data:/app/data ghcr.io/<owner>/lfdd-server:latest
# 首次启动会打印随机管理员账号密码（只打印一次）；配置/数据库/上传都在 /app/data。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/server.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ${{ github.repository }}-server

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # 需要 arm64 时把 platforms 改成 linux/amd64,linux/arm64（CGO 交叉编译走 QEMU，构建会明显变慢）
      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

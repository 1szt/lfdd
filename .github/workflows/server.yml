name: Server Image

# 构建后端（Go）镜像并导出为 docker 镜像包（tar）：
#   产物 lfdd-server-image → lfdd-server.tar，内含镜像 lfdd-server:latest
#   使用：docker load -i lfdd-server.tar && docker run -d -p 9081:9081 -v lfdd-data:/app/data lfdd-server:latest
# 触发：手动运行、推送 v* 标签、main 分支上 server 目录变更。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/server.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像并导出 tar
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          # type=docker 只能单平台；需要 arm64 时改 platforms 并分别导出
          platforms: linux/amd64
          tags: lfdd-server:latest
          outputs: type=docker,dest=${{ runner.temp }}/lfdd-server.tar

      - uses: actions/upload-artifact@v4
        with:
          name: lfdd-server-image
          path: ${{ runner.temp }}/lfdd-server.tar
          if-no-files-found: error

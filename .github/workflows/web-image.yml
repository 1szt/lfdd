name: Web Image

# 构建前端（Quasar SPA）nginx 镜像并导出为 docker 镜像包（tar）：
#   产物 lfdd-web-image → lfdd-web.tar，内含镜像 lfdd-web:latest
#   使用：docker load -i lfdd-web.tar && docker run -d -p 8080:80 lfdd-web:latest
# 后端地址在构建时注入前端产物，运行期无法修改：
#   仓库 Variables LFDD_API_BASE，或手动触发时填 api_base
# 触发：手动运行、推送 v* 标签、main 分支上 client 目录变更。
on:
  workflow_dispatch:
    inputs:
      api_base:
        description: 后端地址（留空则使用仓库变量 LFDD_API_BASE）
        required: false
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "client/**"
      - ".github/workflows/web-image.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像并导出 tar
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          platforms: linux/amd64
          tags: lfdd-web:latest
          build-args: |
            API_BASE=${{ inputs.api_base || vars.LFDD_API_BASE }}
          outputs: type=docker,dest=${{ runner.temp }}/lfdd-web.tar

      - uses: actions/upload-artifact@v4
        with:
          name: lfdd-web-image
          path: ${{ runner.temp }}/lfdd-web.tar
          if-no-files-found: error

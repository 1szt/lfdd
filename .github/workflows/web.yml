name: Web

# 两套产物：
#   1. 站点包（job: spa）→ lfdd-web → lfdd-web.zip
#      解压即为站点根目录内容（index.html 在根），丢给任意静态服务器/nginx
#   2. 镜像版（job: image）→ lfdd-web-image → lfdd-web.tar，内含镜像 lfdd-web:latest
#      docker load -i lfdd-web.tar && docker run -d -p 8080:80 lfdd-web:latest
# 后端地址通过 Variables 注入（构建时写死进前端产物，运行期不可改）：
#   LFDD_API_BASE  后端地址，如 https://api.example.com（同域可留空）
# 触发：手动运行、推送 v* 标签、main 分支上 client 目录变更。
on:
  workflow_dispatch:
    inputs:
      api_base:
        description: 后端地址（留空则使用仓库变量 LFDD_API_BASE）
        required: false
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "client/**"
      - ".github/workflows/web.yml"

jobs:
  # 静态站点包（非镜像版本）
  spa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: 安装前端依赖
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: 写入构建环境变量
        working-directory: client
        env:
          API_BASE: ${{ inputs.api_base || vars.LFDD_API_BASE }}
        run: |
          echo "VITE_API_BASE=$API_BASE" > .env
          cat .env

      - name: 构建网页
        working-directory: client
        run: pnpm quasar build -m spa

      - name: 打包站点文件
        working-directory: client/dist/spa
        run: zip -r "$RUNNER_TEMP/lfdd-web.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: lfdd-web
          path: ${{ runner.temp }}/lfdd-web.zip
          if-no-files-found: error

  # 镜像版本
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像并导出 tar
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          platforms: linux/amd64
          tags: lfdd-web:latest
          build-args: |
            API_BASE=${{ inputs.api_base || vars.LFDD_API_BASE }}
          outputs: type=docker,dest=${{ runner.temp }}/lfdd-web.tar

      - uses: actions/upload-artifact@v4
        with:
          name: lfdd-web-image
          path: ${{ runner.temp }}/lfdd-web.tar
          if-no-files-found: error

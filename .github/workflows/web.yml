name: Web

# 两套产物：
#   1. 站点包（job: spa）→ lfdd-web → lfdd-web.zip
#      解压即为站点根目录内容（index.html 在根），丢给任意静态服务器/nginx
#   2. 镜像版（job: image）→ 推送到 GHCR，同时导出 lfdd-web.tar
#      ghcr.io/<owner>/lfdd-web:latest / :main / :vX.Y.Z / :sha-xxxx
#      docker load -i lfdd-web.tar && docker run -d -p 8080:80 lfdd-web:latest
# 后端地址通过 Variables 注入（构建时写死进前端产物，运行期不可改）：
#   LFDD_API_BASE  后端地址，如 https://api.example.com（同域可留空）
# 触发：手动运行、推送 v* 标签、main 分支上 client 目录变更。
on:
  workflow_dispatch:
    inputs:
      api_base:
        description: 后端地址（留空则使用仓库变量 LFDD_API_BASE）
        required: false
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "client/**"
      - ".github/workflows/web.yml"

jobs:
  # 静态站点包（非镜像版本）
  spa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: 安装前端依赖
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: 写入构建环境变量
        working-directory: client
        env:
          API_BASE: ${{ inputs.api_base || vars.LFDD_API_BASE }}
        run: |
          echo "VITE_API_BASE=$API_BASE" > .env
          cat .env

      - name: 构建网页
        working-directory: client
        run: pnpm quasar build -m spa

      - name: 打包站点文件
        working-directory: client/dist/spa
        run: zip -r "$RUNNER_TEMP/lfdd-web.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: lfdd-web
          path: ${{ runner.temp }}/lfdd-web.zip
          if-no-files-found: error

  # 镜像版本：推送到 GHCR，同时导出 tar 供离线部署
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ${{ github.repository }}-web
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: ./client
          file: ./client/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            API_BASE=${{ inputs.api_base || vars.LFDD_API_BASE }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 导出离线 tar
        env:
          TAG: ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
        run: |
          docker pull "$TAG"
          docker tag "$TAG" lfdd-web:latest
          docker save lfdd-web:latest -o "$RUNNER_TEMP/lfdd-web.tar"

      - uses: actions/upload-artifact@v4
        with:
          name: lfdd-web-image
          path: ${{ runner.temp }}/lfdd-web.tar
          if-no-files-found: error

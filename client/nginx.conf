server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # 压缩文本类资源
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json application/wasm image/svg+xml;

    # 构建产物文件名带 hash，可长期缓存
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|ico|map)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # 入口文件不缓存，保证发版后能立即拿到新的资源清单
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 其余路径回落到入口文件（当前项目为 hash 路由，保留兜底以防切到 history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 需要同域反代后端时打开（此时前端构建参数 API_BASE 留空即可）：
    # location /api/ {
    #     proxy_pass         http://lfdd-server:9081;
    #     proxy_set_header   Host              $host;
    #     proxy_set_header   X-Real-IP         $remote_addr;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    # }
}

basePath: /api
definitions:
  install.CheckData:
    properties:
      need_install:
        type: boolean
    type: object
  install.CheckResponse:
    properties:
      code:
        type: integer
      data:
        $ref: '#/definitions/install.CheckData'
      message:
        type: string
    type: object
  install.InstallRequest:
    properties:
      db_host:
        type: string
      db_name:
        type: string
      db_password:
        type: string
      db_path:
        type: string
      db_port:
        type: string
      db_type:
        type: string
      db_user:
        type: string
      server_ip:
        type: string
      server_port:
        type: string
    type: object
  install.InstallResponse:
    properties:
      code:
        type: integer
      message:
        type: string
    type: object
  menu.CategoryItem:
    properties:
      goods:
        items:
          $ref: '#/definitions/menu.GoodsItem'
        type: array
      id:
        type: integer
      name:
        type: string
    type: object
  menu.GoodsItem:
    properties:
      desc:
        type: string
      icon:
        type: string
      id:
        type: integer
      name:
        type: string
      price:
        type: integer
    type: object
  menu.MenuResponse:
    properties:
      categories:
        items:
          $ref: '#/definitions/menu.CategoryItem'
        type: array
      code:
        type: integer
      message:
        type: string
    type: object
info:
  contact: {}
  description: lfdd 后端接口文档（swaggo 自动生成）。修改 handler 注释后执行 `swag init` 更新。
  title: lfdd 管理系统 API
  version: "1.0"
paths:
  /install/check:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: data.need_install=true 表示需要初始化
          schema:
            $ref: '#/definitions/install.CheckResponse'
      summary: 检查服务器是否已初始化
      tags:
      - 安装
  /install/submit:
    post:
      consumes:
      - application/json
      parameters:
      - description: 初始化参数（sqlite 必填 server_ip/server_port/db_type/db_path，其余数据库类型必填
          server_ip/server_port/db_type/db_host/db_port/db_name/db_user/db_password）
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/install.InstallRequest'
      responses:
        "200":
          description: 初始化完成，随后服务热切换
          schema:
            $ref: '#/definitions/install.InstallResponse'
        "400":
          description: 参数错误或已初始化
          schema:
            $ref: '#/definitions/install.InstallResponse'
        "500":
          description: 写入配置失败
          schema:
            $ref: '#/definitions/install.InstallResponse'
      summary: 提交初始化配置（写入配置并热重载数据库连接与监听端口）
      tags:
      - 安装
  /menu:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/menu.MenuResponse'
      summary: 获取菜品分类与商品列表
      tags:
      - 菜单
swagger: "2.0"
